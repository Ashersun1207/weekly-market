<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>周度市场预期和板块观察</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/main.css">
<style>
  /* === Index-only styles === */
  .index-wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: 80px 24px 60px;
    position: relative;
    z-index: 1;
  }

  .index-title {
    font-size: clamp(26px, 5vw, 36px);
    font-weight: 900;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
  }

  .index-sub {
    color: var(--text-muted);
    font-size: 14px;
    margin-bottom: 48px;
    font-family: var(--font-mono);
    letter-spacing: 1px;
  }

  .archive-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .archive-link {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 22px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-primary);
    text-decoration: none;
    transition: border-color 0.2s, background 0.2s, transform 0.15s;
    font-size: 15px;
    line-height: 1.5;
  }

  .archive-link:hover {
    border-color: var(--accent-blue);
    background: var(--bg-card-hover);
    transform: translateX(4px);
  }

  .archive-link .date {
    color: var(--accent-blue);
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .archive-link .title {
    color: var(--text-secondary);
    font-size: 14px;
  }

  .archive-link .sep {
    color: var(--border-accent);
  }

  @media (max-width: 480px) {
    .index-wrap { padding: 48px 16px 40px; }

    .archive-link {
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      padding: 14px 16px;
    }

    .archive-link .sep { display: none; }
  }
</style>
</head>
<body>
<div class="index-wrap">
  <h1 class="index-title">📊 周度市场观察</h1>
  <p class="index-sub">Weekly Market Brief Archive</p>

  <div class="archive-list">
    <a class="archive-link" href="2026-03-08.html">
      <span class="date">2026.03.08</span>
      <span class="sep">—</span>
      <span class="title">已经没有简单题 / 赔率够吸引但战争通胀长尾风险不敢 All In</span>
    </a>
  </div>
</div>
</body>
</html>
