*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0a0c10;
  --card: #11141a;
  --border: #1e2330;
  --text: #e8eaf0;
  --muted: #555d75;
  --blue: #3b82f6;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans SC', system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.wrap { max-width: 600px; padding: 60px 24px; }
h1 { font-size: 28px; font-weight: 900; margin-bottom: 8px; }
.sub { color: var(--muted); font-size: 14px; margin-bottom: 40px; }
a {
  display: block;
  padding: 16px 20px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  text-decoration: none;
  margin-bottom: 8px;
  transition: border-color 0.2s;
  font-size: 15px;
}
a:hover { border-color: var(--blue); }
a .date { color: var(--blue); font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
</style>
</head>
